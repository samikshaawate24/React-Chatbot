<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>  

    <script type="text/babel">
        

        function ChatInput(){
            const [inputText, setInputText]=React.useState('');
            function saveInputText(event){
              setInputText(event.target.value);

        }

         function sendMessage(){
                console.log(inputText);
         }
            return(
                <>
                    <input placeholder="Send a message to Chatbot" 
                    size="30" 
                    onChange={saveInputText}
                    />
                    <button 
                    onClick ={sendMessage}>
                        Send
                    </button>
                    
                </>
            );
        }

        function ChatMessage(props){
            const {message , sender} = props;

            return(
                <div>
                    {sender === 'robot' && (
                        <img src="img/robot.png" width="50"/>
                    )} 

                    {message}

                    {sender === 'user' &&  (
                        <img src="img/user.png" width="50"/> 
                    )}
                </div>
            );
        }

        function ChatMessages(){

            // ✅ Fixed useState destructuring
            const [ChatMessages, setChatMessages] = React.useState([
                {
                     message : "hello Chatbot",
                     sender : "user",
                     id : 'id1'
                },
                {
                    message :"Heyy, How i can help you ?" ,
                    sender :"robot",
                    id :'id2'
                },
                {
                    message :"can you get me todays date?" ,
                    sender : "user",
                    id : 'id3'
                },
                {
                    message : "Today is September 27",
                    sender : "robot",
                    id : 'id4'
                }
            ]);

            function sendMessage(){
                
               setChatMessages([
                // ✅ Fixed spread (use state, not function)
                ...ChatMessages,
                {
                    message :'test',
                    sender : 'user',
                    id : crypto.randomUUID()
                }
               ]);
            }

            return (
                <>
                    <button onClick ={sendMessage}>Send Message</button>

                    {/* ✅ Fixed variable name in map */}
                    {ChatMessages.map((msg) => {
                        return(
                            <ChatMessage
                                message={msg.message}
                                sender ={msg.sender}
                                key ={msg.id}
                            />
                        );
                    })}
                </>
            )
        }

        function App(){
            return(
             <>
                <ChatInput/>
                <ChatMessages/>
            </>
            );
        }

        const container = document.querySelector(".container");
        ReactDOM.createRoot(container).render(<App></App>);

    </script>
</body>
</html>
